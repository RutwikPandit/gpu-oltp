<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="#ffffff"/>
  <text x="70" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111111">GH200 throughput summary</text>
  <text x="70" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#555555">Point-lookups over a memory-resident 64 million-key / ~1.6 GB table.</text>
  <line x1="130" y1="520" x2="990" y2="520" stroke="#222222" stroke-width="2"/>
  <line x1="130" y1="120" x2="130" y2="520" stroke="#222222" stroke-width="2"/>
  <line x1="130" y1="453" x2="990" y2="453" stroke="#e6e6e6" stroke-width="1"/>
  <line x1="130" y1="387" x2="990" y2="387" stroke="#e6e6e6" stroke-width="1"/>
  <line x1="130" y1="320" x2="990" y2="320" stroke="#e6e6e6" stroke-width="1"/>
  <line x1="130" y1="253" x2="990" y2="253" stroke="#e6e6e6" stroke-width="1"/>
  <line x1="130" y1="187" x2="990" y2="187" stroke="#e6e6e6" stroke-width="1"/>
  <line x1="130" y1="120" x2="990" y2="120" stroke="#e6e6e6" stroke-width="1"/>
  <text x="89" y="525" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">0</text>
  <text x="74" y="458" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">1</text>
  <text x="74" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">2</text>
  <text x="74" y="325" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">3</text>
  <text x="74" y="258" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">4</text>
  <text x="74" y="192" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">5</text>
  <text x="74" y="125" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333">6</text>
  <text x="28" y="326" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333333" transform="rotate(-90 28 326)">throughput (Gop/s)</text>
  <rect x="200" y="441" width="120" height="79" fill="#cc3333"/>
  <text x="210" y="429" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#cc3333">1.19</text>
  <text x="178" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">Grace 64T</text>
  <text x="166" y="578" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">DRAM-resident</text>
  <rect x="405" y="300" width="120" height="220" fill="#1f6feb"/>
  <text x="420" y="288" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6feb">3.3</text>
  <text x="383" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">persistent</text>
  <text x="396" y="578" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">runtime</text>
  <rect x="610" y="189" width="120" height="331" fill="#0a7f3f"/>
  <text x="623" y="177" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0a7f3f">4.96</text>
  <text x="589" y="556" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">RGI launch</text>
  <text x="604" y="578" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">ceiling</text>
  <path d="M320 350 C355 324, 370 311, 405 300" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">2.8x over CPU DRAM</text>
  <path d="M525 260 C560 230, 575 205, 610 189" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">runtime reaches ~2/3 of kernel ceiling</text>
  <rect x="690" y="396" width="300" height="72" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
  <text x="710" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#333333">End-to-end runtime result</text>
  <text x="710" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333333">3.3 Gop/s at B=1M, measured.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
